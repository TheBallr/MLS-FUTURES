<title>MLS Futures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<style>
/* Same design as the Prem Futures site: black top bar with centred tabs, bordered cards on a dark grey page, tabular odds.
   Wording rule (Zac 2026-10-23, CLAUDE.md section 0): numbers in grids, short labels, status words; explanations in hovers only. */
:root{
  /* matte charcoal (Zac 2026-10-23): warm greys, no pure white, muted status colours, one copper accent */
  --brand:#1b1c1f;--brand-dark:#141517;--brand-fg:#cfc9bf;
  --bg:#24262a;--card:#2c2f34;--card-2:#33373d;--zebra:#2f3237;--fg:#d6d1c8;--muted:#a39d93;
  --line:#3d4148;--accent:#c48a5a;--fav:#3b3a36;--hover:#3a3e45;
  --up:#8fb58a;--down:#c9705f;--warn:#d1b06b;--note:#9aa3ad;
  --crest-bg:#e7e2d8;--crest-fg:#24262a;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 13px/1.4 var(--font)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);border-bottom:2px solid var(--brand-dark)}
.top .in{max-width:1660px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;height:46px}
.tabs{display:flex;gap:2px;grid-column:2}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--brand-fg);font:700 13.5px var(--font);padding:0 12px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.unitb{padding:2px 8px;font-size:11px;margin-right:10px}.meta{grid-column:3;justify-self:end;color:var(--brand-fg);font-size:12px;font-weight:600;display:flex;align-items:center;white-space:nowrap}
main{max-width:1800px;margin:0 auto;padding:14px 16px 28px}
.panel{display:grid;gap:14px}
.panel[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.card h2{font-size:12px;font-weight:800;margin:0;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--card-2);display:flex;align-items:baseline;gap:10px;text-transform:uppercase;letter-spacing:.04em}
.card h2 small{color:var(--muted);font-size:11px;font-weight:600;text-transform:none;letter-spacing:0}
.card h2[title]::after,.card summary h2[title]::after{content:"?";display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);font-size:9px;color:var(--muted);text-transform:none;letter-spacing:0;cursor:help;opacity:.8}
.card h2 .right{margin-left:auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 6px;border:0;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
tbody tr:nth-child(even):not(.day):not(.detail):not(.sub-head)>td{background:var(--zebra)}
th{color:var(--fg);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--card-2)}
thead tr:first-child th{border-top:0}
tr>:first-child{border-left:0}tr>:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
thead tr:last-child th{border-bottom:2px solid var(--line)}
th.l,td.l{text-align:left}
.sep{border-left:1px solid var(--line)!important}
tbody tr:hover>td{background:var(--hover)}
td.odd{font-weight:700;min-width:40px;padding-inline:3px}
td.odd.fav,table.mini td.fav{color:var(--accent)}
td.num{font-weight:700}
td.team{font-weight:700;text-align:left}
.tm{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.crest{width:24px;height:24px;flex:none;display:inline-grid;place-items:center;background:var(--crest-bg);border-radius:50%;padding:2px;overflow:hidden;color:var(--crest-fg);font-size:8px;font-weight:800}
.crest img{width:100%;height:100%;object-fit:contain}
.crest.sm{width:22px;height:22px}
.day td{background:var(--card-2)!important;color:var(--fg);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:4px 8px}
td.kick{font-weight:600;padding-inline:3px}
td.score{font-weight:800}
.dim{opacity:.55;font-weight:500}
.d{font-size:10.5px;margin-left:3px;font-weight:600}
.pos{color:var(--up)}.neg{color:var(--down)}
.wk-nav{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:2px}
.wk-nav .note{font-size:11.5px}
.hand{width:58px;-moz-appearance:textfield;appearance:textfield;background:var(--card-2);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:3px 4px;font:600 12.5px var(--font);text-align:right}
.hand::-webkit-inner-spin-button,.hand::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hand.edited{border-color:var(--accent);color:var(--accent)}

.hw{display:inline-flex;align-items:stretch;gap:2px}
.hstep{display:flex;flex-direction:column;gap:1px}
.hstep button{width:18px;height:12px;padding:0;border:1px solid var(--line);border-radius:2px;background:var(--card-2);color:var(--fg);font-size:8px;line-height:1;cursor:pointer}

.rt select.sel{width:auto;max-width:420px;background:var(--card-2);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:4px 6px;font:700 12px var(--font)}
.rt .wk-nav{justify-content:flex-start;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
button.b{font:700 12px var(--font);padding:5px 11px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.b:disabled{opacity:.45;cursor:default}
button.b:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.b.primary{background:var(--fav);border-color:var(--accent)}
button.b.on{background:var(--fav);border-color:var(--accent)}
.status{font-size:12px;font-weight:600}
.rt{max-width:1560px;margin:0 auto;width:100%}
.rt td.team{width:1%;white-space:nowrap;padding-right:14px}.rt td.band{width:1%}
.rt td{padding:3px 5px;font-size:12.5px;line-height:1.2}.rt th{padding:4px 4px}.rt .d{font-size:10px;margin-left:2px}.rt .crest{width:22px;height:22px}.rt .hand{width:50px;padding:1px 3px;font-size:12px}.rt .hstep button{line-height:1;padding:0 2px}
/* club colour: a bar on every club cell, the sparkline and the futures line (data/club_colours.csv) */
td.team,td.tm3{box-shadow:inset 3px 0 0 var(--cc,transparent)}
.rt td.team{padding-left:10px}
.s-info{color:var(--note)}
.tabdot{opacity:.9}
.head{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;background:var(--crest-bg)}
.head.ini{display:inline-grid;place-items:center;font-size:8px;font-weight:800;color:var(--crest-fg);letter-spacing:0}
table.mini td.l .head{width:20px;height:20px}
/* club drawer (10) */
.dr-bg{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.4)}.dr-bg[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);z-index:20;background:var(--bg);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.35);overflow-y:auto}
.drawer[hidden]{display:none}
.dr-in{padding:12px 14px 40px;display:grid;gap:12px}
.dr-top{display:flex;align-items:center;gap:12px}.dr-head{display:flex;align-items:center;gap:12px}.dr-head .crest{width:52px;height:52px}
.dr-name{font-size:19px;font-weight:800;line-height:1.1}.dr-sub{font-size:12px;color:var(--muted);margin-top:3px}
#drClose{margin-left:auto;padding:4px 10px}
.drawer .tiles{border:0}.drawer .tile{padding:9px 10px}.drawer .tile .val{font-size:18px}
.drawer table{font-size:12.5px}.drawer th,.drawer td{padding:5px 5px}
/* bracket (8) and seed heatmap (9) */
.slot.pin{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.slot .sl-pin{font-size:9.5px;letter-spacing:.05em;color:var(--accent)}.slot.lock .sl-p{color:var(--up)}.slot.wcw{border-style:solid;background:var(--card)}
.br-bottom{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:4px 10px 12px;border-top:1px solid var(--line);max-width:760px}.br-bottom .br-h{text-align:left;padding:6px 0 4px}.br-cupin{padding:4px 0;max-width:none;margin:0}.br-mv .none{padding:6px 0;font-size:12px;color:var(--muted)}
.colmenu .cm-i{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}.colmenu .cm-i:hover{background:var(--hover)}.colmenu .cm-i .sl-p{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;padding-left:12px}.colmenu .cm-h{padding:4px 10px 2px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}#brMenu{max-height:70vh;overflow-y:auto}
.brc{max-width:1560px}.brg{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-areas:"eh eh eh eh ch wh wh wh wh" "es er ese ef cup wf wse wr ws";gap:4px 8px;padding:8px 10px 12px}
.brg .br-conf{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--card-2);padding:4px 8px;border-radius:3px;text-align:center}.brg .eh{grid-area:eh}.brg .ch{grid-area:ch}.brg .wh{grid-area:wh}
.br-col{display:flex;flex-direction:column;min-width:0}.br-col .br-h{padding:6px 0 4px}.br-h small{display:block;font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--muted);margin-top:1px}.br-col .sl-wrap{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:6px}.br-col.es{grid-area:es}.br-col.er{grid-area:er}.br-col.ese{grid-area:ese}.br-col.ef{grid-area:ef}.br-col.cup{grid-area:cup}.br-col.wf{grid-area:wf}.br-col.wse{grid-area:wse}.br-col.wr{grid-area:wr}.br-col.ws{grid-area:ws}
.brg .slot{min-width:0;padding:4px 6px;gap:5px;min-height:34px}.brg .slot .sl-2{display:none}.brg .slot .sl-lbl{flex:none;min-width:22px;font-size:9.5px}.brg .slot .crest{width:20px;height:20px}.brg .slot b{font-size:12px}.brg .slot .sl-p{font-size:12px}.brg .slot .sl-car{color:var(--muted);font-size:9px;margin-left:2px;opacity:.6}.brg .slot:hover .sl-car{opacity:1;color:var(--fg)}.brg .slot.pin .sl-car,.brg .slot.lock .sl-car{display:none}
.brg .br-col.cup .sl-wrap{justify-content:center;gap:10px}.brg .br-col.cup .vs{text-align:center;font-size:10.5px;font-weight:800;color:var(--muted)}
@media (max-width:1250px){.brg{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-areas:"eh eh eh eh" "es er ese ef" "wh wh wh wh" "ws wr wse wf" "ch ch ch ch" "cup cup cup cup"}.brg .br-col.cup{max-width:300px;margin:0 auto;width:100%}}
.br-h{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.slot{display:flex;align-items:center;gap:6px;background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--cc,var(--line));border-radius:3px;padding:5px 7px;min-height:38px;white-space:nowrap;cursor:pointer}
.slot .crest{width:22px;height:22px}.slot b{font-size:12.5px}.slot .sl-p{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.slot .sl-lbl{font-size:10px;font-weight:800;color:var(--muted);min-width:18px}.slot .sl-2{font-size:10.5px;color:var(--muted);margin-left:4px}
.slot.tbd{color:var(--muted)}
.wc{display:grid;gap:4px;border:1px dashed var(--line);border-radius:3px;padding:4px}.wc .br-h{padding:0 0 2px}
.br-cupin{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:12px 14px 6px;max-width:760px;margin:0 auto}

.br-champ{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 14px 12px;max-width:760px;margin:0 auto}
td.hm{font-variant-numeric:tabular-nums;font-weight:600;min-width:44px}td.hm.z{color:var(--muted);opacity:.5}
/* what if (11) */
.wi-seg{display:inline-flex;gap:2px}.wi-seg button{font:700 10px var(--font);padding:2px 5px;border:1px solid var(--line);border-radius:2px;background:var(--card-2);color:var(--muted);cursor:pointer;min-width:20px}

.card.wi{border-color:var(--accent)}
/* line path chart (7) */
@media (max-width:900px){.brg{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"eh eh" "es er" "ese ef" "wh wh" "ws wr" "wse wf" "ch ch" "cup cup"}}
.two{display:flex}
.two>div{flex:1 1 auto;min-width:0;overflow-x:auto}
.two>div:first-child{border-right:2px solid var(--line)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.gm{max-width:1080px}.gm th.l,.gm td.tm3{width:1%;white-space:nowrap}.gm td.kick{width:1%}.gm td.tm3{padding-right:18px}.gm td.odd{width:58px}.gm td.gapc,.gm td.score,.gm td.ifc{width:1%;white-space:nowrap;padding-inline:14px}.gm .wk-title{min-width:120px;text-align:center}.gm .seg{margin-left:auto;display:flex;gap:6px}

 worker.postMessage(msg(runRatings(),runKn,'base'))};
async function mergeDoc(path,patch){try{if(window.claude&&window.claude.use){const db=await window.claude.use('db');if(db){const ref=db.doc(path);try{await ref.update(patch)}catch(e){const snap=await ref.get();await ref.set({...((snap&&snap.exists&&snap.data())||{}),...patch})}return true}}}catch(e){console.warn('db merge failed',e)}return false}
// ---------- status chips and number formats (shared by the Morning tab) ----------
const SW={ok:'OK',warn:'Watch',bad:'Act',info:'Note'};
const chip=st=>`<span class="chip s-${st}">${SW[st]||st}</span>`;
const g2=(x,n=2)=>x==null||isNaN(x)?'–':Math.abs(x)<0.005?'<span class="zero">0.00</span>':`<span class="${x>0?'pos':'neg'}">${sgn(x,n)}</span>`;
const pts=x=>x==null?'–':Math.abs(x)<0.05?'<span class="zero">–</span>':`<span class="${x>0?'pos':'neg'}">${x>0?'+':''}${x.toFixed(1)}</span>`;
// ---------- first render ----------
// ---------- morning report (scripts/morning.py; the last 14 embedded by build_site.py, newest first) ----------
const MR=window.MORNING||[],byCode=Object.fromEntries(teams.map(t=>[t.code,t]));let mnI=0;
const tc=c=>byCode[c]?tm(byCode[c],c,true):c;const tcc=c=>cc(byCode[c]);
const fl={big:'<span class="chip s-bad">Big</span>',watch:'<span class="chip s-warn">Watch</span>'};
function renderMorning(){
 if(!MR.length){$('#mnMoved').innerHTML='<div class="none">No morning report yet: scripts/morning.py writes one after each morning run.</div>';return}
 const R=MR[mnI];$('#mnDay').innerHTML=MR.map((r,i)=>`<option value="${i}"${i===mnI?' selected':''}>${r.date}${i===0?' (latest)':''}</option>`).join('');$('#mnDay').onchange=e=>{mnI=+e.target.value;renderMorning()};
 const G=R.games||[],flagged=G.filter(g=>g.flag),nBig=G.filter(g=>g.flag==='big').length,dot=$('#mnDot');if(mnI===0&&flagged.length){dot.hidden=false;dot.className='tabdot s-'+(nBig?'bad':'warn')}
 // ----- left: what moved since the previous report (lines, futures, ratings, injuries, model) -----
 const N=R.new||{results:[],ratings:[],futures:[],injuries:[],model:[]};const K=k=>`<span class="kchip">${k}</span>`;const rows=[];
 const row=(kind,who,what,was,move,note)=>rows.push(`<tr><td class="kind">${kind}</td><td class="who l">${who}</td><td class="what l">${what}</td><td class="num">${was}</td><td class="num">${move}</td><td class="why dim l">${note}</td></tr>`);
 G.filter(g=>g.move&&g.move.prev!=null&&Math.abs(g.move.prev)>=0.05).sort((a,b)=>Math.abs(b.move.prev)-Math.abs(a.move.prev)).forEach(g=>row(K('line'),`${tc(g.home)} v ${tc(g.away)}`,md(g.date),`${sgn(g.line-g.move.prev)} → <b>${sgn(g.line)}</b>`,g2(g.move.prev),`ours ${sgn(g.ours)} · ${g.move.prev*g.gap>0?'toward us':'away from us'}`));
 N.futures.forEach(x=>row(K('futures'),tc(x.code),x.pool,`${fmtP(x.then/100)} → <b>${fmtP(x.now/100)}</b>`,pts(x.d),''));
 N.ratings.forEach(x=>row(K('rating'),tc(x.code),'Rating',`${sgn(x.then)} → <b>${sgn(x.now)}</b>`,g2(x.d),`Pin ${sgn(x.d_market)}${Math.abs(x.d_xg)>=0.005?` · xG ${sgn(x.d_xg)}`:''}${Math.abs(x.d_hand)>=0.005?` · hand ${sgn(x.d_hand)}`:''}`));
 N.injuries.forEach(x=>row(K('injury'),tc(x.code),x.player,x.kind,g2(-x.cost),''));
 N.model.forEach(x=>row(K('model'),'',x.change,'','',''));
 $('#mnMoved').innerHTML=rows.length?`<thead><tr><th></th><th class="l">Club</th><th class="l">Item</th><th>Was → now</th><th>Move</th><th class="l">Note</th></tr></thead><tbody>${rows.join('')}</tbody>`:`<tbody><tr><td class="l dim" style="padding:10px 12px">Nothing moved: no line 0.05+, no futures price a point, no rating 0.02, no injury change.</td></tr></tbody>`;
 // ----- left: games where we disagree with Pinnacle (0.10+ goals), the rest counted -----
 const why=g=>g.why&&g.why.length?g.why.join(' · '):'';
 const VC={'we may be right':'ok','Pinnacle right':'info','coin flip':'warn'},VW={'we may be right':'Maybe us','Pinnacle right':'Pin right','coin flip':'Flip'};
 const dis=G.filter(g=>Math.abs(g.gap)>=0.10),quiet=G.length-dis.length;
 $('#mnGamesSub').textContent=G.length?`${dis.length} of ${G.length} lined`:'';
 $('#mnGames').innerHTML=!G.length?'<tbody><tr><td class="l dim" style="padding:10px 12px">No Pinnacle lines for the next 8 days.</td></tr></tbody>':!dis.length?'<tbody><tr><td class="l dim" style="padding:10px 12px">Every lined game within 0.10 goals of Pinnacle.</td></tr></tbody>':
  `<thead><tr><th class="l">Game</th><th class="l">Kick</th><th class="sep" title="Pinnacle's posted line as a home margin, goals">Pin</th><th title="our ratings' home margin without this round's lines">Ours</th><th class="sep" title="ours minus Pinnacle, goals of home margin; watch at 0.15, big at 0.25">Gap</th><th></th><th class="sep l" title="who is more likely right: the line's move since posted decides, else Pinnacle's last four closes on the club we lean on; hover for what to do">Verdict</th><th class="sep l" title="what pushes us away from Pinnacle, largest first">Why</th></tr></thead><tbody>`+
  dis.map(g=>`<tr><td class="who l">${tc(g.home)} v ${tc(g.away)}</td><td class="what l dim">${g.ko}</td><td class="sep num">${sgn(g.line)}</td><td class="num">${sgn(g.ours)}</td><td class="sep num gap">${g2(g.gap)}</td><td class="kind">${fl[g.flag]||''}</td><td class="sep what l">${g.verdict?`<span class="chip s-${VC[g.verdict]||'info'}" title="${g.verdict}: ${(g.basis||'')+(g.action?' · '+g.action:'')}">${VW[g.verdict]||g.verdict}</span>`:''}</td><td class="sep why l">${why(g)}</td></tr>`).join('')+'</tbody>';
 $('#mnFoot').textContent=quiet>0?`${quiet} more within 0.10`+(R.unlined&&R.unlined.length?` · ${R.unlined.length} unlined`:''):(R.unlined&&R.unlined.length?`${R.unlined.length} unlined`:'');
 renderReview(R);
 // ----- right: what is uncertain (data issues, hands under review, least sure ratings), one table -----
 const CK=(R.checks||[]).filter(c=>c.key!=='hand'),issues=CK.filter(c=>c.status==='bad'||c.status==='warn');
 const HS=R.hands||[];const U=[];
 const urow=(kind,who,ours,could,why,title)=>U.push(`<tr><td class="kind">${kind}</td><td class="who l">${who}</td><td class="num">${ours}</td><td class="sep num">${could}</td><td class="sep why l"${title?` title="${title}"`:''}>${why}</td></tr>`);
 issues.forEach(c=>urow(chip(c.status),c.label,'','',c.text));
 HS.forEach(h=>urow(K('hand'),tc(h.code),sgn(h.hand),'',h.verdict==='too early'?`${h.n} close${h.n===1?'':'s'} since set${h.since?' '+md(h.since):''} · judged at 2`:`${h.verdict==='keep'?'keep':`${h.verdict} to ${sgn(h.suggest)}`} · ${h.n} closes since set sit ${sgn(h.last4)} from us`));
 const CF=R.confidence||[];
 CF.forEach(c=>urow(K('rating'),tc(c.code),sgn(c.rating),`${sgn(c.lo)} to ${sgn(c.hi)}`,c.why.join(' · '),`Pin last 4 ${sgn(c.w4)} · 8 ${sgn(c.w8)} · 12 ${sgn(c.w12)} · line ${c.posted==null?'–':sgn(c.posted)} · Cup ${c.cup.toFixed(1)}%`));
 $('#mnUnsure').innerHTML=U.length?`<thead><tr><th></th><th class="l">Club</th><th>Ours</th><th class="sep" title="Pinnacle's windows plus ours">Could be</th><th class="sep l">Why</th></tr></thead><tbody>${U.join('')}</tbody>`:'<tbody><tr><td class="l dim" style="padding:10px 12px">Nothing to doubt: data current, no hands, every rating inside Pinnacle\'s own range.</td></tr></tbody>';
 renderMovers(R)}
// movers (17): the five biggest 7-day futures moves as bars, from the archived runs
function renderMovers(R){const box=$('#mnMovers');const runs=HX.runs;if(runs.length<2){box.innerHTML='<tbody><tr><td class="l dim" style="padding:10px 12px">Needs a week of runs.</td></tr></tbody>';return}
 const R1=runs[runs.length-1],nowT=toT(R1.utc),R7=runs.reduce((bb,r)=>Math.abs(toT(r.utc)-(nowT-7*864e5))<Math.abs(toT(bb.utc)-(nowT-7*864e5))?r:bb,runs[0]);
 const P=[['Playoffs',HXI.playoffs],['Reach semis',HXI.conf_semi],['Conf final',HXI.conf_final],['MLS Cup',HXI.cup_finalist],['Win Cup',HXI.cup]];const mv=[];
 teams.forEach(t=>{const a=R1.m&&R1.m[t.team],b=R7.m&&R7.m[t.team];if(!a||!b)return;let best=null;P.forEach(([lab,i])=>{if(a[i]==null||b[i]==null)return;const d=(a[i]-b[i])*100;if(!best||Math.abs(d)>Math.abs(best.d))best={lab,d,now:a[i],then:b[i]}});if(best&&Math.abs(best.d)>=0.5)mv.push({t,...best})});
 mv.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));const top=mv.slice(0,6);if(!top.length){box.innerHTML='<tbody><tr><td class="l dim" style="padding:10px 12px">No futures price moved half a point in 7 days.</td></tr></tbody>';return}
 const mx=Math.max(...top.map(x=>Math.abs(x.d)));
 box.innerHTML=`<thead><tr><th class="l">Club</th><th class="l">Pool</th><th></th><th title="points of probability, this run v the run a week ago">7d</th></tr></thead><tbody>`+top.map(x=>`<tr title="${x.t.team} ${x.lab}: ${(x.then*100).toFixed(1)}% → ${(x.now*100).toFixed(1)}%"><td class="who l">${tm(x.t,x.t.code,1)}</td><td class="what l dim">${x.lab}</td><td class="bar"><span class="mv-bar"><i style="width:${(Math.abs(x.d)/mx*100).toFixed(0)}%;background:${x.t.color}"></i></span></td><td class="num ${x.d>0?'pos':'neg'}">${x.d>0?'+':''}${x.d.toFixed(1)}</td></tr>`).join('')+'</tbody>'}
// review (15): the results since the previous report, by our price
function renderReview(R){const box=$('#mnReview');const V=R.review,N=R.new||{};if(!V||!(N.results||[]).length){box.hidden=true;return}box.hidden=false;
 $('#mnReviewTitle').textContent=V.label;$('#mnReviewSub').textContent=`${V.n} result${V.n===1?'':'s'}`;
 const bg=V.biggest;
 $('#mnReviewTiles').innerHTML=`<div class="tile" title="rmse of our match-morning margin v the close over these games"><div class="lbl">Miss v close</div><div class="val sm s-${V.rmse==null?'info':V.rmse<=0.26?'ok':V.rmse<=0.30?'warn':'bad'}">${V.rmse==null?'–':V.rmse.toFixed(2)}<small>goals</small></div><div class="sub">normal 0.24</div></div>`+
  `<div class="tile" title="log-loss on the results, lower is better"><div class="lbl">Results</div><div class="val sm">${V.ll_ours.toFixed(3)}<small>v Pin ${V.ll_pin.toFixed(3)}</small></div><div class="sub">${V.ll_ours<=V.ll_pin?'we priced them better':'Pinnacle priced them better'}</div></div>`+
  `<div class="tile" title="the result we gave the lowest probability"><div class="lbl">Biggest surprise</div><div class="val sm">${bg?`${tc(bg.home)} ${bg.score} ${tc(bg.away)}`:'–'}</div><div class="sub">${bg?`we had the ${bg.res==='H'?'home win':bg.res==='D'?'draw':'away win'} at ${bg.p_ours.toFixed(0)}% (Pin ${bg.p_pin.toFixed(0)}%)`:''}</div></div>`+
  `<div class="tile" title="clinched a playoff place or eliminated since the previous report"><div class="lbl">Race</div><div class="val sm">${V.changes.length?V.changes.map(c=>`${tc(c.code)} <small>${c.what==='out'?'out':'in'}</small>`).join(' '):'–'}</div><div class="sub">${V.changes.length?'since the last report':'no clinch or elimination'}</div></div>`;
 $('#mnReviewTab').innerHTML=`<thead><tr><th class="l">Date</th><th class="l">Game</th><th>FT</th><th class="sep" title="our match-morning margin without that round's lines">Ours</th><th>Close</th><th>Miss</th><th class="sep" title="probability we gave the actual result; Pinnacle's in grey">Result</th><th title="100 minus our probability of the result">Surprise</th></tr></thead><tbody>`+
  [...N.results].sort((a,b)=>b.surprise-a.surprise).map(x=>`<tr><td class="l">${md(x.date)}</td><td class="l">${tc(x.home)} v ${tc(x.away)}</td><td class="score">${x.score}</td><td class="sep">${sgn(x.ours)}</td><td>${sgn(x.close)}</td><td>${g2(x.miss)}</td><td class="sep">${x.res} ${x.p_ours.toFixed(0)}% <span class="dim">${x.p_pin.toFixed(0)}%</span></td><td class="${x.surprise>=75?'s-bad':x.surprise>=60?'s-warn':''}">${x.surprise.toFixed(0)}</td></tr>`).join('')+'</tbody>'}
// Ratings column filter (Zac 2026-10-19): tick the columns to show; hidden ones are remembered in this browser
const RT_COLS=[[3,'Rating'],[4,'95% band'],[5,'Hand'],[6,'xPts'],[7,'Conf 1st'],[8,'Playoffs'],[9,'Top 4'],[10,'Reach semis'],[11,'Reach conf final'],[12,'Reach MLS Cup'],[13,'Win MLS Cup'],[14,'Bottom']];
let rtHidden=new Set([4,7,9,10,11,14]);try{const v4=localStorage.getItem('mls.rtcols4');if(v4!=null)rtHidden=new Set(JSON.parse(v4))}catch(e){} // rtcols4 (2026-10-23 night): six columns by default so both conferences sit side by side on one screen; older keys ignored
function applyRtCols(){const rt=document.querySelector('.rt');RT_COLS.forEach(([i])=>rt.classList.toggle('hc'+i,rtHidden.has(i)));
 const n=rtHidden.size;$('#rtColsBtn').textContent=n?`Columns (${RT_COLS.length-n}/${RT_COLS.length}) ▾`:'Columns ▾';try{localStorage.setItem('mls.rtcols4',JSON.stringify([...rtHidden]))}catch(e){}}
$('#rtCols').innerHTML=RT_COLS.map(([i,l])=>`<label><input type="checkbox" data-col="${i}"${rtHidden.has(i)?'':' checked'}> ${l}</label>`).join('')+'<div class="cm-foot"><button class="b" id="rtColsAll">Show all</button><button class="b" id="rtColsDone">Done</button></div>';
$('#rtCols').querySelectorAll('input').forEach(c=>c.onchange=()=>{const i=+c.dataset.col;c.checked?rtHidden.delete(i):rtHidden.add(i);applyRtCols()});

const rtColsClose=()=>{$('#rtCols').hidden=true;$('#rtColsBtn').setAttribute('aria-expanded','false')};
$('#rtColsDone').onclick=rtColsClose;

// ---------- 4. light / dark (remembered) ----------
$('#unitBtn').onclick=()=>{UNIT=UNIT==='am'?'pct':'am';try{localStorage.setItem('mls.unit',UNIT)}catch(e){};setUnitBtn();renderRatings();renderGames();renderMorning();renderBracket();if(!$('#drawer').hidden)openClub(hxClub)};
renderRatings();renderGames();renderMorning();renderBracket();
